apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrier-status
  labels: { app: carrier-status }
spec:
  replicas: 1
  selector:
    matchLabels: { app: carrier-status }
  template:
    metadata:
      labels: { app: carrier-status }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: status
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
