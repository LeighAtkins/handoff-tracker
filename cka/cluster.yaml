# CKA practice cluster: Kubernetes v1.35 (the exam version), one control plane, two workers.
# localhost:8096 -> ingress controller on the control plane; localhost:8097 -> web NodePort 30095.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cka
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8096, listenAddress: "127.0.0.1" }
      - { containerPort: 30095, hostPort: 8097, listenAddress: "127.0.0.1" }
  - role: worker
    image: kindest/node:v1.35.8
  - role: worker
    image: kindest/node:v1.35.8
