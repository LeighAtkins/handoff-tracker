name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://handoff:handoff@localhost:5432/handoff

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: handoff
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoff" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # P3: fail if anything under /data is tracked.
      - name: No real data committed
        run: |
          if git ls-files --error-unmatch data >/dev/null 2>&1; then
            echo "Files under /data are tracked. Real customer data must never be committed."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Domain and carrier tests are pure; app use-case tests run against the Postgres service.
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: handoff
          POSTGRES_PASSWORD: handoff
          POSTGRES_DB: handoff
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U handoff" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @handoff/db migrate:deploy
      - run: pnpm build
      - run: pnpm --filter @handoff/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @handoff/e2e test:e2e
        env:
          CI: "true"
          # Test-only: the developer login is limited to localhost and never enabled when deployed.
          AUTH_DEV_LOGIN: "true"
          AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependencies (lockfile), committed secrets and Dockerfile misconfigurations.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: data
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Build images
        run: |
          docker build -f infra/docker/web.Dockerfile -t handoff-web:ci .
          docker build -f infra/docker/worker.Dockerfile -t handoff-worker:ci .

      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: handoff-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Trivy scan (worker image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: handoff-worker:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
