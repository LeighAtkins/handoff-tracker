# Private deployment on one small VM: Caddy (automatic HTTPS) -> web, plus worker and Postgres.
# Usage (on the VM, from infra/deploy):  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# Tracking sources (ADR-0003, ADR-0004), for web (live lookups) and worker. Empty means "not connected".
x-tracking-keys: &tracking-keys
  FOURPX_APP_KEY: ${FOURPX_APP_KEY:-}
  FOURPX_APP_SECRET: ${FOURPX_APP_SECRET:-}
  FOURPX_API_URL: ${FOURPX_API_URL:-}
  SHIP24_API_KEY: ${SHIP24_API_KEY:-}
  SEVENTEEN_TRACK_API_KEY: ${SEVENTEEN_TRACK_API_KEY:-}
  AFTERSHIP_API_KEY: ${AFTERSHIP_API_KEY:-}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: handoff
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoff -d handoff"]
      interval: 5s
      retries: 20
    # Not published: only web and worker can reach it.

  migrate:
    image: ${WORKER_IMAGE:-ghcr.io/leighatkins/handoff-tracker-worker:latest}
    working_dir: /app/packages/db
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: &app-env
      DATABASE_URL: postgresql://handoff:${POSTGRES_PASSWORD}@postgres:5432/handoff?schema=public
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Tokyo}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    image: ${WEB_IMAGE:-ghcr.io/leighatkins/handoff-tracker-web:latest}
    restart: unless-stopped
    environment:
      <<: [*app-env, *tracking-keys]
      APP_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      DELIVERY_TARGET_DAYS: ${DELIVERY_TARGET_DAYS:-7}
      # AUTH_DEV_LOGIN is deliberately absent. Never set it here.
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/leighatkins/handoff-tracker-worker:latest}
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/index.ts", "--loop"]
    environment:
      <<: [*app-env, *tracking-keys]
      WORKER_INTERVAL_SECONDS: "300"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  caddy-data:
