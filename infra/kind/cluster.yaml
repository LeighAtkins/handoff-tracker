# Local cluster for Handoff Tracker. The web Service's NodePort 30095 is published on localhost:8095.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: handoff
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30095
        hostPort: 8095
        listenAddress: "127.0.0.1"
