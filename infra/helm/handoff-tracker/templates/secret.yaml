{{- if not .Values.secrets.existingSecret }}
{{- $db := .Values.secrets.databaseUrl }}
{{- if .Values.postgres.enabled }}
{{- $db = printf "postgresql://handoff:%s@%s-postgres:5432/handoff?schema=public" .Values.postgres.password (include "ht.name" .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ht.name" . }}-secrets
  labels: {{- include "ht.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl (or postgres.enabled) is required" $db | quote }}
  AUTH_SECRET: {{ required "secrets.authSecret is required (32+ characters)" .Values.secrets.authSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  SHIP24_API_KEY: {{ .Values.secrets.ship24ApiKey | quote }}
  SEVENTEEN_TRACK_API_KEY: {{ .Values.secrets.seventeenTrackApiKey | quote }}
  AFTERSHIP_API_KEY: {{ .Values.secrets.aftershipApiKey | quote }}
{{- end }}
