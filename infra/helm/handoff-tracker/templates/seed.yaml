{{- if .Values.seed.enabled }}
# Loads the fake demo data once. Local clusters only; never point this at real data.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ht.name" . }}-seed
  labels: {{- include "ht.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "ht.selector" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      {{- include "ht.podSecurity" . | nindent 6 }}
      containers:
        - name: seed
          image: {{ include "ht.image" .Values.image.worker }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          # Migrate first (the web pods may not have yet), then seed. tsx resolves from the worker package.
          command:
            - sh
            - -c
            - cd /app/packages/db && node_modules/.bin/prisma migrate deploy && cd /app/apps/worker && node --import tsx /app/packages/db/src/seed.ts
          {{- include "ht.env" . | nindent 10 }}
          {{- include "ht.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
