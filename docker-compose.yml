services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: handoff
      POSTGRES_DB: handoff
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handoff -d handoff"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
